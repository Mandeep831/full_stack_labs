<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixell River Employee Directory</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <img 
            src="https://itsm-ace.ca/images/logo.svg" 
            alt="Pixell River Financial logo"
        >

        <div class="header-content">
            <h1>Pixell River Employee Directory</h1>
            <p>Welcome to the Pixell River Financial employee directory.</p>
            <p>View employees and the departments they belong to.</p>
        </div>
    </header>

    <main>
        <section>
            <h2>Employees and Departments</h2>
            <p>
                Below is a list of employees organized by their department.
            </p>

            <div id="employee-directory">
                <!-- Employee information will be added using JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p id="copyright">
            <!-- Copyright year will be added using JavaScript -->
        </p>
    </footer>

</body>
</html>

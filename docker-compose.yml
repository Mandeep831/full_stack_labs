
services:
  postgres:
    image: postgres:16
    container_name: lab42-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab42password
      POSTGRES_DB: pixell_river
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
